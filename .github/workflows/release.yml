name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: verify package.json version matches tag
        run: |
          TAG="${{ github.ref_name }}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$PKG_VERSION" ]]; then
            echo "error: tag $TAG does not match package.json version $PKG_VERSION"
            echo "Run 'bun run release' locally instead of tagging manually."
            exit 1
          fi

      - name: build source zip
        run: bun run package

      - name: build platform binaries
        run: |
          for TARGET in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            SUFFIX="${TARGET#bun-}"
            bun build src/main.ts --compile --target="$TARGET" --outfile="mesh-$SUFFIX"
            echo "built mesh-$SUFFIX"
          done

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            mesh-src.zip \
            mesh-linux-x64 \
            mesh-linux-arm64 \
            mesh-darwin-x64 \
            mesh-darwin-arm64
